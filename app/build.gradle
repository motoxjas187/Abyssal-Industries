plugins { id 'com.android.application' }
android {
    namespace 'com.abyssal.industries'
    compileSdk 34
    defaultConfig {
        applicationId 'com.abyssal.industries'
        minSdk 26
        targetSdk 34
        versionCode 26
        versionName '0.26'
    }
    // One fixed TEST key so every build installs over the last one.
    // Not for the Play Store: the release key must stay private.
    signingConfigs {
        debug {
            storeFile file('test.keystore')
            storePassword 'abyssal-test'
            keyAlias 'test'
            keyPassword 'abyssal-test'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
